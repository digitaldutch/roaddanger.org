<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9534f"/>
    </marker>
  </defs>

  <!-- browser window -->
  <rect x="10" y="10" width="700" height="280" rx="10" fill="#ffffff" stroke="#b8b8b8" stroke-width="2"/>
  <path d="M10,20 a10,10 0 0 1 10,-10 h680 a10,10 0 0 1 10,10 v22 h-700 z" fill="#e4e6ea"/>
  <circle cx="30" cy="26" r="5" fill="#ff5f57"/><circle cx="48" cy="26" r="5" fill="#febc2e"/><circle cx="66" cy="26" r="5" fill="#28c840"/>

  <!-- address bar -->
  <rect x="10" y="42" width="700" height="34" fill="#f3f4f6"/>
  <rect x="30" y="49" width="660" height="20" rx="10" fill="#ffffff" stroke="#d0d0d0"/>

  <!-- bookmarks bar, with the place where the bookmark lands -->
  <rect x="10" y="76" width="700" height="30" fill="#eceef1"/>
  <rect x="24" y="82" width="70" height="18" rx="4" fill="#d3d6db"/>
  <rect x="104" y="82" width="70" height="18" rx="4" fill="#d3d6db"/>
  <rect x="184" y="82" width="70" height="18" rx="4" fill="#d3d6db"/>
  <rect x="264" y="82" width="120" height="18" rx="4" fill="none" stroke="#d9534f" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="680" y="96" font-family="sans-serif" font-size="13" fill="#888" text-anchor="end">Ctrl + Shift + B</text>

  <!-- page content -->
  <rect x="40" y="130" width="300" height="12" rx="4" fill="#e1e3e7"/>
  <rect x="40" y="154" width="520" height="8" rx="4" fill="#eceef1"/>
  <rect x="40" y="172" width="480" height="8" rx="4" fill="#eceef1"/>
  <rect x="40" y="190" width="500" height="8" rx="4" fill="#eceef1"/>

  <!-- the button on the page -->
  <rect x="440" y="226" width="150" height="38" rx="6" fill="#111111"/>
  <path d="M470,236 h18 a2,2 0 0 1 2,2 v22 l-11,-6 l-11,6 v-22 a2,2 0 0 1 2,-2 z" fill="#ffffff"/>
  <rect x="500" y="241" width="76" height="8" rx="3" fill="#ffffff"/>

  <!-- drag arrow -->
  <path d="M500,218 C470,170 420,130 365,106" fill="none" stroke="#d9534f" stroke-width="4" marker-end="url(#arr)"/>

  <!-- mouse pointer -->
  <path d="M588,248 l0,26 l7,-6 l5,12 l5,-2 l-5,-12 l9,0 z" fill="#222" stroke="#fff" stroke-width="1.5"/>

  <!-- step numbers -->
  <circle cx="430" cy="245" r="0" fill="none"/>
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">
    <circle cx="610" cy="215" r="13" fill="#d9534f"/><text x="610" y="220">1</text>
    <circle cx="320" cy="116" r="13" fill="#d9534f"/><text x="320" y="121">2</text>
  </g>
</svg>
