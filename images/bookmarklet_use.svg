<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
  <!-- browser window with a news article -->
  <rect x="10" y="10" width="700" height="320" rx="10" fill="#ffffff" stroke="#b8b8b8" stroke-width="2"/>
  <path d="M10,20 a10,10 0 0 1 10,-10 h680 a10,10 0 0 1 10,10 v22 h-700 z" fill="#e4e6ea"/>
  <circle cx="30" cy="26" r="5" fill="#ff5f57"/><circle cx="48" cy="26" r="5" fill="#febc2e"/><circle cx="66" cy="26" r="5" fill="#28c840"/>
  <rect x="10" y="42" width="700" height="34" fill="#f3f4f6"/>
  <rect x="30" y="49" width="660" height="20" rx="10" fill="#ffffff" stroke="#d0d0d0"/>

  <!-- bookmarks bar with the bookmark -->
  <rect x="10" y="76" width="700" height="30" fill="#eceef1"/>
  <rect x="24" y="82" width="70" height="18" rx="4" fill="#d3d6db"/>
  <rect x="104" y="82" width="70" height="18" rx="4" fill="#d3d6db"/>
  <rect x="184" y="82" width="70" height="18" rx="4" fill="#d3d6db"/>
  <rect x="264" y="81" width="130" height="20" rx="4" fill="#111111"/>
  <path d="M278,86 h8 a1,1 0 0 1 1,1 v10 l-5,-3.5 l-5,3.5 v-10 a1,1 0 0 1 1,-1 z" fill="#ffffff"/>
  <rect x="296" y="89" width="84" height="4" rx="2" fill="#ffffff"/>

  <!-- news site header -->
  <rect x="10" y="106" width="700" height="30" fill="#c0392b"/>
  <rect x="40" y="117" width="110" height="9" rx="3" fill="#ffffff"/>
  <rect x="520" y="119" width="40" height="6" rx="3" fill="#f3b9b2"/>
  <rect x="580" y="119" width="40" height="6" rx="3" fill="#f3b9b2"/>
  <rect x="640" y="119" width="40" height="6" rx="3" fill="#f3b9b2"/>

  <!-- the article: headline, photo and text -->
  <rect x="40" y="154" width="420" height="16" rx="4" fill="#2a2d33"/>
  <rect x="40" y="178" width="300" height="16" rx="4" fill="#2a2d33"/>
  <rect x="40" y="208" width="190" height="104" rx="4" fill="#c9d3dc"/>
  <path d="M40,312 l60,-48 l40,30 l36,-26 l54,44 z" fill="#aebbc7"/>
  <circle cx="190" cy="232" r="10" fill="#e6ecf1"/>
  <rect x="250" y="210" width="420" height="8" rx="4" fill="#dfe2e6"/>
  <rect x="250" y="228" width="400" height="8" rx="4" fill="#dfe2e6"/>
  <rect x="250" y="246" width="420" height="8" rx="4" fill="#dfe2e6"/>
  <rect x="250" y="264" width="380" height="8" rx="4" fill="#dfe2e6"/>
  <rect x="250" y="282" width="410" height="8" rx="4" fill="#dfe2e6"/>
  <rect x="250" y="300" width="300" height="8" rx="4" fill="#dfe2e6"/>

  <!-- mouse pointer on the bookmark, step 1 -->
  <path d="M372,92 l0,24 l7,-5.5 l4.5,11 l4.5,-2 l-4.5,-11 l9,0 z" fill="#222" stroke="#fff" stroke-width="1.5"/>
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">
    <circle cx="430" cy="91" r="13" fill="#d9534f"/><text x="430" y="96">1</text>
  </g>
</svg>
